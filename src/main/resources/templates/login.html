<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Pre-Ordering System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Sign in to access your pre-orders and menu</p>
        </div>

        <div th:replace="~{fragments :: alerts}"></div>

        <!-- Pre-loaded Demo Accounts Helper -->
        <div class="demo-credentials-box">
            <strong>Demo Accounts (Click or type):</strong><br>
            • Customer: <code>customer@foodhub.com</code> / <code>customer123</code><br>
            • Vendor: <code>vendor@foodhub.com</code> / <code>vendor123</code><br>
            • Admin: <code>admin@foodhub.com</code> / <code>admin123</code>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Email Address</label>
                <input type="email" id="username" name="username" placeholder="name@example.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a th:href="@{/register}" style="color: var(--primary); font-weight: 600;">Register as Customer</a>
        </p>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

</body>
</html>

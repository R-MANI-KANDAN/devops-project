<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Food Item - Vendor</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="container" style="max-width: 600px;">
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${foodItem.id == null ? 'Add New Food Item' : 'Edit Food Item'}">Food Item</h1>
            <p class="page-subtitle">Configure recipe name, category classification, and price.</p>
        </div>
        <a th:href="@{/vendor/menu}" class="btn btn-outline">&larr; Back to Catalog</a>
    </div>

    <div th:replace="~{fragments :: alerts}"></div>

    <div class="card">
        <form th:action="@{/vendor/menu/save}" th:object="${foodItem}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="name">Dish / Food Name *</label>
                <input type="text" id="name" th:field="*{name}" placeholder="e.g. Schezwan Fried Rice" required>
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>

            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" th:field="*{category}" required>
                    <option value="">-- Choose Category --</option>
                    <option value="Starters">Starters &amp; Appetizers</option>
                    <option value="Biryani">Biryani &amp; Rice</option>
                    <option value="Main Course">Main Course &amp; Curries</option>
                    <option value="Burger">Burgers &amp; Sandwiches</option>
                    <option value="Pizza">Pizza &amp; Italian</option>
                    <option value="Beverages">Beverages &amp; Shakes</option>
                    <option value="Dessert">Desserts &amp; Sweets</option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
            </div>

            <div class="form-group">
                <label for="price">Price (₹ INR) *</label>
                <input type="number" id="price" th:field="*{price}" step="0.50" min="1.0" placeholder="120.00" required>
                <span class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
            </div>

            <div class="form-group">
                <label for="description">Short Description *</label>
                <textarea id="description" th:field="*{description}" rows="3" placeholder="Description of ingredients, flavors, and allergens..." required></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 0.6rem;">
                <input type="checkbox" id="available" th:field="*{available}" style="width: auto;">
                <label for="available" style="margin-bottom: 0; font-weight: normal;">Mark this item as available for immediate pre-order</label>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Dish to Menu</button>
                <a th:href="@{/vendor/menu}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

</body>
</html>
